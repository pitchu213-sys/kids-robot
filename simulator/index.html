<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="وجه الروبوت">
    <meta name="theme-color" content="#0a0c16">
    <title>وجه الروبوت الذكي - شاشة الطفل</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="robot.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="face-only-mode">
    <div class="mobile-container face-app">
        
        <!-- Head Touch Sensor (TTP223 Emulation) -->
        <header class="head-touch-zone" id="headTouchZone">
            <div class="touch-pill">
                <span class="touch-icon">👆</span>
                <span class="touch-label">المس رأسي للتفاعل</span>
                <span class="touch-sensor-indicator" id="touchSensorLed"></span>
            </div>
        </header>

        <!-- Robot Core Display Unit (Mirrors GC9A01 & 12 WS2812 LEDs) -->
        <main class="robot-body">
            <div class="led-ring-container" id="ledRingContainer">
                <!-- 12 WS2812 Neopixel LEDs -->
                <div class="neopixel-led" data-index="0"></div>
                <div class="neopixel-led" data-index="1"></div>
                <div class="neopixel-led" data-index="2"></div>
                <div class="neopixel-led" data-index="3"></div>
                <div class="neopixel-led" data-index="4"></div>
                <div class="neopixel-led" data-index="5"></div>
                <div class="neopixel-led" data-index="6"></div>
                <div class="neopixel-led" data-index="7"></div>
                <div class="neopixel-led" data-index="8"></div>
                <div class="neopixel-led" data-index="9"></div>
                <div class="neopixel-led" data-index="10"></div>
                <div class="neopixel-led" data-index="11"></div>

                <!-- Circular Display (GC9A01 240x240) -->
                <div class="screen-gc9a01" id="screenDisplay">
                    <canvas id="faceCanvas" width="240" height="240"></canvas>
                    
                    <!-- Subtitle / Speech Bubble -->
                    <div class="story-overlay" id="storyOverlay">
                        <p id="storyText">مرحباً يا بطل! أنا روبوتك الذكي، المس رأسي لنلعب معاً... 🌟</p>
                    </div>

                    <!-- Listening Voice Waves -->
                    <div class="voice-wave-container" id="voiceWaveContainer">
                        <span class="wave-bar"></span>
                        <span class="wave-bar"></span>
                        <span class="wave-bar"></span>
                        <span class="wave-bar"></span>
                        <span class="wave-bar"></span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Pure Child Action Controls: Big, Simple, Intuitive -->
        <footer class="interaction-bar child-bar">
            <button class="action-btn mic-btn" id="micBtn" title="تحدث مع الروبوت">
                <span class="btn-icon">🎤</span>
                <span class="btn-text">تحدث معي</span>
            </button>

            <button class="action-btn next-btn" id="nextStoryBtn" title="متابعة">
                <span class="btn-icon">✨</span>
                <span class="btn-text">التالي</span>
            </button>

            <!-- Small discrete connection indicator to the Brain -->
            <a href="brain.html" target="_blank" class="brain-link-btn" title="فتح عقل الروبوت">
                🧠
            </a>
        </footer>

    </div>

    <script src="robot.js"></script>
</body>
</html>
